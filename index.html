<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>夜出桑华山</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background: #0b0e14;
            color: #c3d1e6;
            font-family: 'Courier New', monospace;
            padding: 20px;
            max-width: 1000px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        h1, h2 {
            color: #e6d5a8;
            text-shadow: 2px 2px 0 #1a1f2a;
            margin-top: 0;
        }
        /* 主菜单样式 */
        #main-menu {
            position: relative;
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(rgba(11, 14, 20, 0.85), rgba(11, 14, 20, 0.95)), 
                        url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiPjxkZWZzPjxwYXR0ZXJuIGlkPSJwYXR0ZXJuIiBwYXR0ZXJuVW5pdHM9InVzZXJTcGFjZU9uVXNlIiB4PSIwIiB5PSIwIiB3aWR0aD0iNDAiIGhlaWdodD0iNDAiIHBhdHRlcm5Vbml0cz0idXNlclNwYWNlT25Vc2UiIHBhdHRlcm5UcmFuc2Zvcm09InJvdGF0ZSgzMCkiPjxsaW5lIHgxPSIwIiB5PSIwIiB4Mj0iNDAiIHkyPSI0MCIgc3Ryb2tlPSIjMjMyYTMxIiBzdHJva2Utd2lkdGg9IjAuNSIvPjxwYXRoIGQ9Ik0wIDBoNDB2NDBoLTQweiIvPjwvcGF0dGVybj48L2RlZnM+PHJlY3QgeD0iMCIgeT0iMCIgd2lkdGg9IjEwMCUiIGhlaWdodD0iMTAwJSIgZmlsbD0idXJsKCNwYXR0ZXJuKSIvPjwvc3ZnPg==');
            background-size: cover;
            background-position: center;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(106, 122, 138, 0.15);
            margin: 40px auto;
            padding: 30px;
            width: 100%;
            max-width: 600px;
        }
        #main-menu::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 50% 50%, rgba(230, 213, 168, 0.1) 0%, transparent 70%);
            border-radius: 12px;
            pointer-events: none;
        }
        #main-menu h1 {
            font-size: 3.5rem;
            margin-bottom: 40px;
            text-align: center;
            position: relative;
            z-index: 1;
            text-shadow: 0 0 20px rgba(230, 213, 168, 0.5), 2px 2px 4px rgba(0, 0, 0, 0.8);
            animation: titleGlow 3s ease-in-out infinite alternate;
        }
        @keyframes titleGlow {
            0% { text-shadow: 0 0 10px rgba(230, 213, 168, 0.5), 2px 2px 4px rgba(0, 0, 0, 0.8); }
            100% { text-shadow: 0 0 20px rgba(230, 213, 168, 0.8), 2px 2px 4px rgba(0, 0, 0, 0.8); }
        }
        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 300px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }
        .menu-buttons button {
            background: linear-gradient(145deg, #1e2a3a, #16202d);
            color: #e6d5a8;
            border: 2px solid #6a7a8a;
            padding: 15px 20px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }
        .menu-buttons button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(230, 213, 168, 0.2), transparent);
            transition: left 0.5s ease;
        }
        .menu-buttons button:hover {
            background: linear-gradient(145deg, #2e3e52, #1e2a3a);
            border-color: #aabac8;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(106, 122, 138, 0.3);
        }
        .menu-buttons button:hover::before {
            left: 100%;
        }
        .menu-buttons button:active {
            transform: translateY(0);
            box-shadow: 0 2px 8px rgba(106, 122, 138, 0.2);
        }
        
        /* 技能按钮样式 */
        .skill-buttons {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .skill-button {
            background: linear-gradient(145deg, #1e2a3a, #16202d);
            color: #e6d5a8;
            border: 1px solid #6a7a8a;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            text-align: left;
            transition: all 0.3s ease;
            font-size: 13px;
        }
        .skill-button:hover {
            background: linear-gradient(145deg, #28384a, #1e2a3a);
            border-color: #e6d5a8;
        }
        .skill-button:disabled {
            background: #16202d;
            color: #6a7a8a;
            border-color: #334155;
            cursor: not-allowed;
        }
        .skill-name {
            display: inline;
            font-weight: bold;
        }
        .skill-cost {
            display: inline;
            font-size: 0.75rem;
            color: #ff6666;
            margin-left: 8px;
        }
        .skill-desc {
            display: none;
        }
        
        /* 游戏容器样式 */
        .game-container {
            display: flex;
            gap: 15px;
            align-items: stretch;
        }

        .left-panel {
            flex: 1;
            min-width: 210px;
            background: #0f141c;
            border: 1px solid #3e4d5e;
            border-radius: 8px;
            padding: 15px;
        }

        .center-panel {
            flex: 4;
            min-width: 520px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            height: 700px;
        }

        /* 详情栏样式 */
        #detail-panel {
            background: #0a1018;
            border: 1px solid #3e5568;
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 10px;
            min-height: 180px;
            max-height: 300px;
            flex: 0 0 auto;
            overflow-y: auto;
            white-space: pre-wrap;
            font-size: 14px;
            line-height: 1.6;
            position: relative;
        }

        #detail-panel .detail-actions {
            margin-top: 10px;
            border-top: 1px dashed #4a5a6a;
            padding-top: 10px;
        }

        .right-panel {
            flex: 1.2;
            min-width: 250px;
            background: #0f141c;
            border: 1px solid #3e4d5e;
            border-radius: 8px;
            padding: 15px;
        }

        .panel-title {
            color: #b7a97a;
            font-weight: bold;
            margin-bottom: 10px;
            border-bottom: 1px dashed #4a5a6a;
            padding-bottom: 5px;
        }

        .scene-content {
            color: #c0d0e0;
            font-size: 14px;
            line-height: 1.6;
        }

        .story-text {
            color: #ff6666;
        }

        .scene-desc {
            color: #ffffff;
        }

        #output {
            background: #03060a;
            padding: 15px;
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            border: 1px solid #3a4a6a;
            margin-bottom: 10px;
            white-space: pre-wrap;
            font-size: 15px;
            line-height: 1.5;
            box-shadow: inset 0 0 10px #00000055;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
            margin: 10px 0;
        }

        .save-load {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }
        .scene-info-box {
            background: #0a1018;
            border: 1px solid #3e5568;
            border-radius: 6px;
            padding: 10px 12px;
            margin: 10px 0;
            color: #c0d0e0;
            font-size: 14px;
        }
        .action-buttons button {
            flex: 1;
            background: #1a2632;
            border: 1px solid #4a6a7a;
            color: #d4dcc4;
            padding: 8px 0;
        }
        #input-line {
            display: flex;
            gap: 5px;
            margin-bottom: 10px;
        }
        #cmd-input {
            flex: 1;
            background: #03060a;
            border: 1px solid #3a4a6a;
            color: #c3d1e6;
            padding: 10px;
            font-family: inherit;
            font-size: 15px;
        }
        button {
            background: #1e2a3a;
            color: #e6d5a8;
            border: 1px solid #6a7a8a;
            padding: 10px 16px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            transition: all 0.1s ease;
        }
        button:hover {
            background: #2e3e52;
            border-color: #aabac8;
        }
        .save-load {
            display: flex;
            gap: 8px;
        }
        /* 小地图样式 */
        .minimap {
            text-align: center;
            width: 220px;
            margin: 0 auto;
            flex-shrink: 0;
        }
        .map-grid {
            display: grid;
            grid-template-columns: 60px 60px 60px;
            gap: 8px;
            margin: 15px auto;
            justify-content: center;
        }
        .map-cell {
            background: #0a1018;
            border: 1px solid #3e5568;
            padding: 8px 5px;
            border-radius: 4px;
            font-size: 13px;
            color: #bdd4e0;
            transition: all 0.1s ease;
            width: 60px;
            height: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }
        .map-cell.clickable {
            cursor: pointer;
            border-color: #8aa0b5;
        }
        .map-cell.clickable:hover {
            background: #16222e;
            border-color: #c0d4e6;
        }
        .map-cell.empty {
            opacity: 0.3;
            pointer-events: none;
            background: #0a1018;
            border-color: #2a3a4a;
        }
        .map-cell.clickable {
            cursor: pointer;
        }
        .current-room-name {
            font-size: 18px;
            font-weight: bold;
            color: #e6d5a8;
            margin-bottom: 10px;
            border-bottom: 1px dashed #5a6a7a;
            padding-bottom: 5px;
        }
        .room-number-info {
            text-align: center;
            color: #ffdd44;
            font-size: 14px;
            font-weight: bold;
            margin-top: 10px;
        }
        .story-note {
            font-style: italic;
            color: #9aabbb;
            margin-top: 5px;
            font-size: 13px;
        }

        /* 游戏界面视觉升级：保持原有三栏位置与功能不变 */
        #game-container {
            position: relative;
            gap: 12px;
            padding-top: 6px;
            background: linear-gradient(90deg, #3f341d, #c7aa60 35%, #3f341d 70%, #121923) top / 100% 5px no-repeat;
        }
        #game-container .left-panel,
        #game-container .right-panel {
            background: linear-gradient(160deg, #111923, #0a0f16 72%);
            border-color: #344456;
            border-radius: 3px;
            box-shadow: inset 0 0 24px rgba(0, 0, 0, 0.28), 0 8px 24px rgba(0, 0, 0, 0.14);
        }
        #game-container .left-panel { min-width: 190px; padding: 13px; }
        #game-container .right-panel { min-width: 220px; padding: 13px; }
        #game-container .center-panel { min-width: 500px; height: 720px; }
        #game-container .panel-title {
            color: #d9c58e;
            letter-spacing: 0.08em;
            border-bottom: 1px solid #3d4c5d;
            padding-bottom: 9px;
            margin-bottom: 10px;
            text-shadow: 0 1px 0 #000;
        }

        /* 周围可见：保留原点击行为，增加对象类型层级 */
        #scene-items-list { display: flex; flex-direction: column; gap: 7px; line-height: 1.35; }
        #scene-items-list .scene-entry {
            margin: 0;
            padding: 9px 8px;
            background: #111923;
            border: 1px solid #2c3948;
            cursor: pointer;
            transition: border-color 0.15s ease, background 0.15s ease, transform 0.15s ease;
        }
        #scene-items-list .scene-entry:hover { background: #1d1c16; border-color: #8d7644; transform: translateX(2px); }
        #scene-items-list .scene-entry--npc { border-left: 3px solid #4b8d69; }
        #scene-items-list .scene-entry--danger { border-left: 3px solid #a54b54; }
        #scene-items-list .scene-entry--object { border-left: 3px solid #8e7946; }
        #scene-items-list .scene-entry--muted { opacity: 0.82; }
        #scene-items-list .scene-entry > span { display: block; color: #c6d2df !important; text-decoration: none !important; }
        #scene-items-list .scene-entry--danger > span { color: #ef9aa1 !important; }
        #scene-items-list .scene-entry--npc > span { color: #a9dfbb !important; }
        #scene-items-list .scene-entry small { display: block; margin-top: 3px; color: #65768a; font-size: 10px; }
        #scene-items-list .scene-pick-all { margin: 5px 0 0; padding: 8px; border: 1px dashed #4d755c; background: #101a15; text-align: center; }
        #scene-items-list .scene-pick-all span { color: #a7d7b7 !important; text-decoration: none !important; }

        /* 详情栏：所有现有面板继续写入同一位置 */
        #detail-panel {
            min-height: 190px;
            max-height: 240px;
            padding: 14px 15px;
            margin-bottom: 8px;
            background: linear-gradient(155deg, #101823, #080d13 76%);
            border-color: #405267;
            border-radius: 3px;
            box-shadow: inset 0 0 28px rgba(0, 0, 0, 0.3), 0 4px 16px rgba(0, 0, 0, 0.15);
            scrollbar-color: #46596e #090e14;
        }
        #detail-panel .detail-title {
            display: flex;
            align-items: center;
            gap: 9px;
            margin: -2px 0 12px;
            color: #ead7a1;
            font-family: Georgia, 'Noto Serif SC', serif;
            font-size: 17px;
            font-weight: bold;
            letter-spacing: 0.08em;
            text-align: center;
        }
        #detail-panel .detail-title::before,
        #detail-panel .detail-title::after { content: ''; height: 1px; flex: 1; background: linear-gradient(90deg, transparent, #75633d); }
        #detail-panel .detail-title::after { background: linear-gradient(90deg, #75633d, transparent); }
        #detail-panel .detail-divider { height: 1px; margin: 11px 0; background: linear-gradient(90deg, transparent, #3c4b5c 12%, #3c4b5c 88%, transparent); }
        #detail-panel .detail-empty { min-height: 150px; display: grid; place-items: center; color: #65768a; font-size: 13px; letter-spacing: 0.03em; }
        #detail-panel span[onclick] {
            display: inline-block;
            margin: 2px 1px;
            padding: 3px 7px;
            border: 1px solid transparent;
            border-radius: 2px;
            text-underline-offset: 3px;
            transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
        }
        #detail-panel span[onclick]:hover { background: #211e15; border-color: #806c40; color: #f0d9a0 !important; }
        #detail-panel .detail-actions { margin-top: 11px; padding-top: 9px; border-top: 1px solid #354456; }
        #detail-panel .detail-empty--compact { min-height: 58px; }
        #detail-panel .inventory-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 7px;
            margin-top: 3px;
        }
        #detail-panel .inventory-entry {
            display: grid;
            grid-template-columns: 26px minmax(0, 1fr);
            align-items: center;
            gap: 0 7px;
            min-width: 0;
            padding: 8px;
            background: #0d141c;
            border: 1px solid #304052;
            border-left: 2px solid #796841;
            cursor: pointer;
            transition: border-color .15s ease, background .15s ease, transform .15s ease;
        }
        #detail-panel .inventory-entry:hover { background: #1b1a14; border-color: #8b7546; transform: translateY(-1px); }
        #detail-panel .inventory-entry__icon { grid-row: 1 / 3; font-size: 18px; text-align: center; }
        #detail-panel .inventory-entry__name {
            min-width: 0;
            padding: 0;
            margin: 0;
            color: #cbd6e2;
            cursor: pointer;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        #detail-panel .inventory-entry small { color: #65768a; font-size: 10px; }
        #detail-panel .status-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 9px;
            padding: 8px 10px;
            background: #121923;
            border: 1px solid #344456;
            color: #e2cc92;
            font-weight: bold;
        }
        #detail-panel .status-heading small { color: #788a9e; font-weight: normal; }
        #detail-panel .status-resource { margin: 7px 0; }
        #detail-panel .status-resource > div:first-child { display: flex; justify-content: space-between; color: #93a3b5; font-size: 11px; }
        #detail-panel .status-resource b { color: #cdd7e1; }
        #detail-panel .status-track { height: 7px; margin-top: 4px; overflow: hidden; background: #04070a; border: 1px solid #283443; }
        #detail-panel .status-fill { display: block; height: 100%; }
        #detail-panel .status-fill--hp { background: linear-gradient(90deg, #842b34, #d85c66); }
        #detail-panel .status-fill--sp { background: linear-gradient(90deg, #28568b, #5b9dd5); }
        #detail-panel .status-fill--exp { background: linear-gradient(90deg, #756027, #c4a652); }
        #detail-panel .status-stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; }
        #detail-panel .status-stat-grid > div { padding: 7px; background: #0d141c; border: 1px solid #304052; text-align: center; }
        #detail-panel .status-stat-grid span { display: block; color: #78899c; font-size: 10px; }
        #detail-panel .status-stat-grid b { display: block; margin-top: 3px; color: #e0c98d; font-size: 16px; }
        #detail-panel .status-note { color: #7e8fa3; text-align: center; font-size: 11px; font-style: italic; }

        /* 详情栏通用组件 */
        #detail-panel .panel-tabs { display: flex; justify-content: center; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
        #detail-panel .panel-tab {
            margin: 0; padding: 5px 10px; color: #77899c; background: #0b1118;
            border: 1px solid #2d3b4b; border-radius: 12px; cursor: pointer; font-size: 11px;
        }
        #detail-panel .panel-tab:hover { color: #e5d19b; border-color: #806d43; background: #1b1912; }
        #detail-panel .panel-tab--active { color: #f0d89c; border-color: #9a8149; background: #282217; box-shadow: inset 0 -2px #b29450; }
        #detail-panel .panel-section-label { margin: 9px 0 6px; color: #8fa1b4; font-size: 10px; font-weight: bold; letter-spacing: .12em; text-transform: uppercase; }
        #detail-panel .panel-footer {
            display: flex; justify-content: center; margin-top: 12px; padding-top: 10px;
            border-top: 1px solid #344354;
        }
        #detail-panel .panel-footer__button,
        #detail-panel > div:last-child > span[onclick],
        #detail-panel > div:last-child[onclick] {
            display: block; width: fit-content; min-width: 112px; margin: 0 auto; padding: 7px 15px; color: #9eafc0 !important;
            background: linear-gradient(#18222d, #0e151d); border: 1px solid #405166;
            border-radius: 3px; cursor: pointer; text-align: center; text-decoration: none !important;
            font: inherit; font-size: 12px; letter-spacing: .06em;
        }
        #detail-panel .panel-footer__button:hover,
        #detail-panel > div:last-child > span[onclick]:hover,
        #detail-panel > div:last-child[onclick]:hover {
            color: #f1d99e !important; border-color: #927b47; background: linear-gradient(#282318, #171711);
            box-shadow: 0 2px 10px rgba(0,0,0,.25), inset 0 -2px #a98d4e;
        }
        #detail-panel .detail-card { padding: 10px; background: #0d141c; border: 1px solid #304052; border-left: 2px solid #796841; }
        #detail-panel .detail-card__header { display: flex; justify-content: space-between; align-items: center; gap: 8px; color: #d8c58f; font-weight: bold; }
        #detail-panel .detail-card__badge { padding: 2px 7px; color: #8fa2b5; background: #111b25; border: 1px solid #35485b; border-radius: 10px; font-size: 10px; font-weight: normal; }
        #detail-panel .detail-card__desc { margin-top: 8px; color: #9eafc1; line-height: 1.65; font-size: 12px; }
        #detail-panel .detail-action-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 6px; margin-top: 9px; }
        #detail-panel .detail-action {
            margin: 0; padding: 7px 5px; color: #b8c7d5 !important; background: #111923;
            border: 1px solid #344557 !important; border-radius: 2px; text-align: center; text-decoration: none !important;
        }
        #detail-panel .detail-action:hover { color: #f0d89e !important; border-color: #8d7745 !important; background: #242016 !important; }
        #detail-panel .detail-action--danger { color: #e8989e !important; border-color: #62363e !important; }
        #detail-panel .detail-action--good { color: #9fd5b2 !important; border-color: #365b45 !important; }
        #detail-panel div:has(> span[onclick]) { cursor: pointer; }
        #detail-panel div:has(> span[onclick]) > span[onclick]:only-of-type { display: block; }

        /* 装备、任务、技能与肢解面板 */
        #detail-panel .equipment-slots { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 7px; }
        #detail-panel .equipment-slot { min-width: 0; padding: 10px 7px; background: #0c131b; border: 1px solid #304052; border-top: 2px solid #796841; text-align: center; }
        #detail-panel .equipment-slot__icon { display: block; font-size: 22px; }
        #detail-panel .equipment-slot small { display: block; margin: 3px 0 5px; color: #66788b; }
        #detail-panel .equipment-slot[onclick] { cursor: pointer; transition: border-color .15s ease, background .15s ease, transform .15s ease; }
        #detail-panel .equipment-slot[onclick]:hover { background: #1d1b14; border-color: #957d49; transform: translateY(-1px); }
        #detail-panel .equipment-slot > span:last-child { display: block; max-width: 100%; margin: 0; padding: 2px; color: #d4c38f !important; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        #detail-panel .equipment-summary { display: grid; grid-template-columns: repeat(3,1fr); gap: 6px; margin-top: 9px; }
        #detail-panel .equipment-summary div { padding: 6px; color: #8193a6; background: #111923; border: 1px solid #2f3d4c; text-align: center; font-size: 10px; }
        #detail-panel .equipment-summary b { display: block; color: #e1ca90; font-size: 15px; }
        #detail-panel .quest-list { display: grid; gap: 6px; }
        #detail-panel .quest-card { display: flex; align-items: center; gap: 9px; padding: 9px; background: #0d141c; border: 1px solid #304052; border-left: 3px solid #8c7040; }
        #detail-panel .quest-card[onclick] { cursor: pointer; transition: border-color .15s ease, background .15s ease, transform .15s ease; }
        #detail-panel .quest-card[onclick]:hover { background: #1d1a13; border-color: #8d7746; transform: translateX(2px); }
        #detail-panel .quest-card--side { border-left-color: #416b93; }
        #detail-panel .quest-card__icon { font-size: 18px; }
        #detail-panel .quest-card > span:nth-child(2) { flex: 1; margin: 0; padding: 0; color: #c8d3df !important; text-decoration: none !important; }
        #detail-panel .quest-card small { color: #66798d; }
        #detail-panel .quest-detail-meta { display: flex; gap: 6px; margin-bottom: 7px; }
        #detail-panel .quest-condition { margin-top: 6px; padding: 7px 9px; color: #a9b6c3; background: #101821; border-left: 2px solid #61758a; }
        #detail-panel .skill-list { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 7px; }
        #detail-panel .skill-card { padding: 9px; background: #0d141c; border: 1px solid #304052; border-top: 2px solid #66508e; cursor: pointer; transition: border-color .15s ease, background .15s ease, transform .15s ease; }
        #detail-panel .skill-card:hover { background: #181522; border-color: #8067a9; transform: translateY(-1px); }
        #detail-panel .skill-card__top { display: flex; justify-content: space-between; gap: 8px; }
        #detail-panel .skill-card__top span { margin: 0; padding: 0; color: #d1c1e7 !important; text-decoration: none !important; }
        #detail-panel .skill-card b { color: #77a7d7; font-size: 10px; }
        #detail-panel .skill-card p { margin: 6px 0 0; color: #74869a; font-size: 10px; line-height: 1.45; }
        #detail-panel .dismember-intro { margin-bottom: 8px; color: #b9878b; text-align: center; font-size: 11px; }
        #detail-panel .limb-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 6px; }
        #detail-panel .limb-option { display: flex; align-items: center; gap: 7px; padding: 8px; color: #c4cdd6; background: #11151b; border: 1px solid #3c353c; cursor: pointer; }
        #detail-panel .limb-option--done { color: #65717d; opacity: .65; }
        #detail-panel .limb-option input { accent-color: #a94e58; }
        #detail-panel .dismember-controls { display: flex; justify-content: space-between; gap: 6px; margin-top: 9px; }
        #detail-panel .dismember-controls span { flex: 1; text-align: center; }

        /* 文本输出框保持核心地位 */
        #output {
            min-height: 300px;
            padding: 16px 17px;
            margin-bottom: 6px;
            background: #020508;
            border-color: #3b4c62;
            border-radius: 2px;
            line-height: 1.65;
            box-shadow: inset 0 0 24px rgba(0, 0, 0, 0.78);
            scrollbar-color: #46596e #070b10;
        }
        #output .story-text { color: #dd7378; }
        #output .scene-desc { color: #e3e8ee; }

        /* 原位置按钮与输入框，仅更新外观 */
        .action-buttons { gap: 6px; margin: 6px 0; }
        .action-buttons button { background: linear-gradient(#17222e, #101720); border-color: #405267; color: #cad6e2; border-radius: 2px; padding: 8px 3px; }
        .action-buttons button:hover { color: #f0d9a0; border-color: #9a824d; background: linear-gradient(#282318, #171711); box-shadow: inset 0 -2px #b89a55; }
        #input-line { gap: 6px; margin-bottom: 7px; }
        #cmd-input { background: #070b10; border-color: #405267; border-radius: 2px; padding: 9px 10px; font-size: 14px; outline: none; }
        #cmd-input:focus { border-color: #9b824b; box-shadow: 0 0 0 1px #43391f; }
        #input-line button { color: #8e9daf; background: linear-gradient(#151e28, #0d141c); border-color: #344456; border-radius: 2px; box-shadow: none; }
        #input-line button:hover,
        #input-line button:focus-visible { color: #f0d9a0; background: linear-gradient(#282318, #171711); border-color: #8d7644; box-shadow: inset 0 -2px #9f864b; }
        .save-load { gap: 5px; margin-top: 0; }
        .save-load button { flex: 1; min-width: 0; padding: 7px 3px; color: #8798aa; background: #0d131a; border-color: #303d4c; border-radius: 2px; font-size: 11px; }
        .save-load button:hover { color: #cbd6e2; border-color: #526377; background: #151e28; }

        /* 小地图：保留点击移动与战斗逃跑逻辑 */
        .minimap { width: 100%; }
        .current-room-name { color: #ddca93; font-size: 16px; letter-spacing: 0.04em; border-bottom: 1px solid #3d4c5d; padding-bottom: 9px; }
        .map-grid { gap: 6px; margin: 14px auto; }
        .map-cell { background: #101821; border-color: #37475a; border-radius: 2px; color: #9aabba; box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.16); }
        .map-cell.clickable { border-color: #53677e; }
        .map-cell.clickable:hover { color: #edd8a0; background: #211d14; border-color: #9c8249; transform: translateY(-1px); }
        .map-cell:not([id]) { background: radial-gradient(circle, #2d2717, #171711) !important; border-color: #9c8249 !important; color: #f0d798; }
        .map-cell.empty { opacity: 0.2; }
        .room-number-info { margin-top: 11px; padding: 7px 0; color: #b89c59; border-top: 1px dashed #39495a; border-bottom: 1px dashed #39495a; font-size: 12px; }
        .story-note { margin-top: 11px; color: #66778b; font-size: 11px; line-height: 1.6; }

        #block-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            z-index: 999;
            display: none;
        }
        #block-overlay.active ~ h1,
        #block-overlay.active ~ .game-container button:not(.skill-button),
        #block-overlay.active ~ .game-container .map-cell,
        #block-overlay.active ~ .game-container input,
        #block-overlay.active ~ .game-container .left-panel {
            opacity: 0.4;
            pointer-events: none;
        }
        #block-overlay.active ~ .game-container .left-panel .scene-content span {
            pointer-events: none;
        }
        /* 战斗中小地图可点击（用于逃跑），仅可通行方向亮起，空格保持置灰 */
        body.battle-mode #block-overlay.active ~ .game-container .map-cell.clickable {
            opacity: 1;
            pointer-events: auto;
            border-color: #ff8844;
        }
        body.battle-mode #block-overlay.active ~ .game-container .map-cell.clickable:hover {
            background: #2a1a10;
            border-color: #ffaa66;
        }

        #story-next-btn,
        #story-skip-btn {
            display: none;
            position: fixed;
            right: 60px;
            width: 130px;
            padding: 10px 0;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            cursor: pointer;
            z-index: 1001;
            border-radius: 6px;
            transition: all 0.15s ease;
        }
        #story-next-btn {
            bottom: 80px;
            background: #2a3a4a;
            color: #e6d5a8;
            border: 2px solid #7a9aae;
        }
        #story-next-btn:hover {
            background: #3a5a6a;
            border-color: #c0d4e6;
        }
        #story-skip-btn {
            bottom: 150px;
            background: #4a2a2a;
            color: #e6d5a8;
            border: 2px solid #ae7a7a;
        }
        #story-skip-btn:hover {
            background: #6a3a3a;
            border-color: #e6c0c0;
        }
        @media (max-width: 768px) {
            #main-menu {
                padding: 20px;
                margin: 10px;
            }
            #main-menu h1 {
                font-size: 2.5rem;
            }
            .menu-buttons {
                max-width: 250px;
            }
            .menu-buttons button {
                padding: 12px 16px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div id="block-overlay"></div>
    <button id="story-next-btn" onclick="onStoryNextClick()">▶ Next</button>
    <button id="story-skip-btn" onclick="StoryEngine.skipLines()">▶▶ 跳过</button>
    <div id="main-menu">
        <h1>夜出桑华山</h1>
        <div class="menu-buttons">
            <button onclick="startGame()">🎮 开始游戏</button>
            <button onclick="loadGameFromMenu()">📚 读取存档</button>
            <button onclick="exitGame()">🚪 退出游戏</button>
        </div>
    </div>
    <div id="game-container" class="game-container" style="display:none;">
        <div class="left-panel">
            <div class="panel-title">📍 周围可见</div>
            <div id="scene-items-list" class="scene-content">— 暂无 —</div>
        </div>
        <div class="center-panel">
            <div id="detail-panel">
                <div class="detail-empty">点击物品或 NPC 查看详情...</div>
            </div>
            <div id="output">载入中…<br></div>
            <div class="action-buttons">
                <button id="btn-inventory" onclick="showInventoryPanel()">🎒 物品</button>
                <button id="btn-equipment" onclick="showEquipmentPanel()">⚔️ 装备</button>
                <button id="btn-status" onclick="showStatusPanel()">📊 状态</button>
                <button id="btn-quests" onclick="showQuestsPanel()">📜 任务</button>
                <button id="btn-skills" onclick="showSkillsPanel()">✨ 技能</button>
            </div>
            <div id="input-line">
                <input type="text" id="cmd-input" placeholder="输入命令 (如 look, n, i)..." autofocus>
                <button onclick="sendCommand()">⏎ 发送</button>
            </div>
            <div class="save-load">
                <button onclick="saveGame()">💾 保存进度</button>
                <button onclick="loadGame()">📂 读取进度</button>
                <button onclick="resetGame()">🔄 重头再来</button>
                <button onclick="backToMainMenu()">🏠 返回主菜单</button>
                <button onclick="clearOutputWindow()">🧹 清空输出</button>
            </div>
        </div>
        <div class="right-panel">
            <div class="minimap">
                <div class="current-room-name" id="room-name-display">二号矿井深处</div>
                <div>🧭 周围地形（点击前往）</div>
                <div class="map-grid">
                    <div></div>
                    <div class="map-cell" id="map-north">
                        <div style="font-size:12px; opacity:0.8;">⬆️ 北</div><div id="north-room">-</div>
                    </div>
                    <div></div>
                    <div class="map-cell" id="map-west">
                        <div style="font-size:12px; opacity:0.8;">⬅️ 西</div><div id="west-room">-</div>
                    </div>
                    <div class="map-cell" style="background:#1a2a3a; border-color:#7a9aae;">
                        <div style="font-size:12px;">📍 当前</div><div id="current-room-name-on-map">矿井深处</div>
                    </div>
                    <div class="map-cell" id="map-east">
                        <div style="font-size:12px; opacity:0.8;">➡️ 东</div><div id="east-room">-</div>
                    </div>
                    <div></div>
                    <div class="map-cell" id="map-south">
                        <div style="font-size:12px; opacity:0.8;">⬇️ 南</div><div id="south-room">-</div>
                    </div>
                    <div></div>
                </div>
                <div class="room-number-info">当前房间编号：<span id="room-number-display">-</span></div>
                <div class="story-note">
                    "桑华山的石矿之下，正下着血与仇的隐秘暴雨。"
                </div>
            </div>
        </div>
    </div>
    
    <!-- 基础数据层 -->
    <script src="items/items_core.js"></script>
    <script src="items/items_ingredients.js"></script>
    <script src="items/items_equipment.js"></script>
    <script src="items/items_scene.js"></script>
    <script src="items/items_mara.js"></script>
    <script src="items/items_generic_female.js"></script>
    <script src="items/items_char_huasha.js"></script>
    <script src="items/items_char_elaine.js"></script>
    <script src="items/items_char_female_serf.js"></script>
    <script src="items/items_char_mandorola.js"></script>
    <script src="items/items_char_aisha.js"></script>
    <script src="items/items_char_liana.js"></script>
    <script src="items/items_char_cecilia.js"></script>
    <script src="items/items_char_isabella.js"></script>
    <script src="items/items_char_sophie.js"></script>
    <script src="items/items_char_elena.js"></script>
    <script src="items/items_char_serena.js"></script>
    <script src="items/items_char_warhorse.js"></script>
    <script src="items/items_recipes.js"></script>
    <script src="items/items_crafting.js"></script>
    <script src="items/items_skills.js"></script>
    <script src="world/world_0.js"></script>
    <script src="world/world_1.js"></script>
    <script src="world/world.js"></script>
    <script src="character.js"></script>
    <script src="characters/char_mainNpcs.js"></script>
    <script src="characters/char_hostileNpcs.js"></script>
    <script src="characters/char_generalNpcs.js"></script>
    <script src="characters/char_slumNpcs.js"></script>
    <script src="characters/char_bountyNpcs.js"></script>
    <script src="modLoader.js"></script>
    <script src="ui.js"></script>
    <script src="game/battle.js"></script>
    <script src="game/skills.js"></script>
    <script src="game/state.js"></script>
    <script src="game/bountySystem.js"></script>
    <script src="game/devTools.js"></script>
    <script src="game/helpers.js"></script>
    <script src="game/story.js"></script>
    <script src="game/storyEngine.js"></script>
    <script src="game/portals.js"></script>
    <script src="game/commands.js"></script>

    <script src="game/sceneItems.js"></script>

    <script src="game/mainMenu.js"></script>
</body>
